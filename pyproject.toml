[project]
name = "data-pipelines"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "boto3>=1.43.67",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyluach>=2.3.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
    "yt-dlp>=2026.7.4",
    "yt-dlp-ejs>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipelines"]

# Pyright is what VS Code's Pylance runs, so this section is also what the editor
# obeys — keeping `uv run pyright` and the squiggles in the editor in agreement.
# "standard" is Pylance's own default; it's pinned here so a Pylance update can't
# silently change what counts as an error.
[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
